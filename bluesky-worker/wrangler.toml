name = "heist-bluesky"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
START_DATE = "2026-11-24"  # the feed was wiped 11-23; nothing earlier gets posted
BSKY_HANDLE = "did:plc:stqre32vjfy2exmy3uapewjw"  # @heist.arugulamotors.com (the DID survives handle changes)
# BSKY_APP_PASSWORD is a secret: npx wrangler secret put BSKY_APP_PASSWORD

# Every 20 minutes through the morning send window (10:40 to 20:00 UTC); it
# posts once, as soon as the day's email is out.
[triggers]
crons = ["*/20 10-20 * * *"]
